name: zambecare

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zambecare}
      POSTGRES_USER: ${POSTGRES_USER:-zambecare_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zambecare_app} -d ${POSTGRES_DB:-zambecare}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [zambecare]

  api:
    build: ./api
    environment:
      PROJECT_NAME: ${PROJECT_NAME:-ZambeCare}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-zambecare_app}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-zambecare}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [zambecare]

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api/v1}
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy
    networks: [zambecare]

  oracle:
    image: container-registry.oracle.com/database/free:latest
    profiles: ["oracle"]
    environment:
      ORACLE_PWD: ${ORACLE_PASSWORD:?Set ORACLE_PASSWORD in .env}
    ports:
      - "${ORACLE_PORT:-1521}:1521"
    volumes:
      - oracle_data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD-SHELL", "echo 'select 1 from dual;' | sqlplus -s system/$${ORACLE_PWD}@localhost:1521/FREEPDB1 | grep -q 1"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 120s
    networks: [zambecare]

  dbt:
    build: ./dbt_zambecare
    profiles: ["analytics"]
    environment:
      DBT_PROFILES_DIR: /usr/app
      ORACLE_HOST: oracle
      ORACLE_PORT: 1521
      ORACLE_SERVICE: ${ORACLE_SERVICE:-FREEPDB1}
      ORACLE_DBT_USER: ${ORACLE_DBT_USER:-zc_dbt}
      ORACLE_DBT_PASSWORD: ${ORACLE_DBT_PASSWORD:?Set ORACLE_DBT_PASSWORD in .env}
    volumes:
      - ./dbt_zambecare:/usr/app
    networks: [zambecare]

networks:
  zambecare:
    driver: bridge

volumes:
  postgres_data:
  oracle_data:
