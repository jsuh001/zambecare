name: ZambeCare CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt
      - run: pip install -r api/requirements.txt
      - run: ruff check app tests
        working-directory: api
      - run: pytest -q
        working-directory: api
        env:
          SECRET_KEY: ci-test-secret-key-that-is-longer-than-thirty-two-characters

  migration-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: zambecare
          POSTGRES_USER: zambecare_app
          POSTGRES_PASSWORD: ci-database-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zambecare_app -d zambecare"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt
      - run: pip install -r api/requirements.txt
      - name: Create Phase 1 clinical schema
        run: psql "$DATABASE_URL_PSQL" -f db/postgres/init/001_oltp_schema.sql
        env:
          DATABASE_URL_PSQL: postgresql://zambecare_app:ci-database-password@localhost:5432/zambecare
      - name: Apply Phase 2 migrations
        run: alembic upgrade head
        working-directory: api
        env:
          DATABASE_URL: postgresql+psycopg://zambecare_app:ci-database-password@localhost:5432/zambecare
          SECRET_KEY: ci-test-secret-key-that-is-longer-than-thirty-two-characters

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  static-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/validate_phase1.sh

  ingestion-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ingestion/requirements.txt
      - run: pip install -r ingestion/requirements.txt
      - run: ruff check src tests
        working-directory: ingestion
      - run: pytest -q
        working-directory: ingestion
      - run: ./scripts/validate_phase3.sh

  container-build:
    runs-on: ubuntu-latest
    needs: [api-tests, migration-test, frontend-build, static-validation, ingestion-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v7
        with:
          context: ./api
          push: false
          tags: zambecare-api:${{ github.sha }}
      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: false
          tags: zambecare-frontend:${{ github.sha }}
      - name: Build ingestion image
        uses: docker/build-push-action@v7
        with:
          context: ./ingestion
          push: false
          tags: zambecare-ingestion:${{ github.sha }}
